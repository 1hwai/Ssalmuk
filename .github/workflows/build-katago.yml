name: Build KataGo browser evaluator

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-katago.yml"

permissions:
  contents: write

concurrency:
  group: katago-runtime
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Ssalmuk
        uses: actions/checkout@v4

      - name: Checkout KataGo WebGPU evaluator
        uses: actions/checkout@v4
        with:
          repository: saigo-online/katago-webgpu
          ref: main
          path: katago-upstream
          submodules: recursive

      - name: Install Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build zlib1g-dev libeigen3-dev
          emcc --version

      - name: Build KataGo WASM evaluator
        working-directory: katago-upstream
        env:
          B18_NET: /tmp/katago-model.bin.gz
        run: |
          set -euxo pipefail
          export EMSDK_DIR="$EMSDK"
          test -f "$EMSDK_DIR/emsdk_env.sh"
          curl -fL --retry 3 \
            https://media.katagotraining.org/uploaded/networks/models/kata1/kata1-b18c384nbt-s9996604416-d4316597426.bin.gz \
            -o /tmp/katago-model.bin.gz
          test -s /tmp/katago-model.bin.gz
          # EmdawnWebGPU requires the final C++ link to use em++ (upstream script uses emcc).
          sed -i 's/^emcc "${OBJS\[@\]}"/em++ "${OBJS[@]}"/' scripts/build-eval.sh
          # Optional upstream demo nets may be absent; don't let their absence fail the build.
          sed -i 's/^bundle() { \[ -f "\$1" \] \&\& { cp "\$1" "\$ROOT\/web\/demo\/\$2"; echo "==> bundled $(basename "\$1") -> web\/demo\/\$2"; }; }/bundle() { if [ -f "$1" ]; then cp "$1" "$ROOT\/web\/demo\/$2"; echo "==> bundled $(basename "$1") -> web\/demo\/$2"; fi; }/' scripts/build-eval.sh
          grep -F 'em++ "${OBJS[@]}"' scripts/build-eval.sh
          bash scripts/build-eval.sh
          test -s web/demo/kataeval.js
          test -s web/demo/kataeval.wasm
          # Exercise the generated WASM and the real b18 KataGo model, not just compilation.
          node web/test-eval.mjs web/demo/model-b18c384nbt.bin.gz

      - name: Install runtime files
        run: |
          set -euxo pipefail
          mkdir -p baduk/katago
          cp katago-upstream/web/demo/kataeval.js baduk/katago/kataeval.js
          cp katago-upstream/web/demo/kataeval.wasm baduk/katago/kataeval.wasm
          cp /tmp/katago-model.bin.gz baduk/katago/model.bin.gz
          test -s baduk/katago/kataeval.js
          test -s baduk/katago/kataeval.wasm
          test -s baduk/katago/model.bin.gz
          node --check baduk/katago/test-sequence-eval.mjs
          node baduk/katago/test-sequence-eval.mjs

      - name: Commit built runtime
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baduk/katago/kataeval.js baduk/katago/kataeval.wasm baduk/katago/model.bin.gz
          if git diff --cached --quiet; then
            echo "KataGo runtime is already up to date"
            exit 0
          fi
          git commit -m "Build and deploy KataGo browser evaluator"
          # The repository may receive UI commits while the model is compiling.
          # Rebase generated binaries on the latest main before pushing.
          git pull --rebase origin main
          git push

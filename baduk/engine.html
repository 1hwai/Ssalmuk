<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>돌담 바둑 AI 엔진</title>
</head>
<body>
  <p id="engine-status" role="status">돌담 자체 AI 엔진을 준비하고 있습니다.</p>
  <script src="./engine.js"></script>
  <script>
    "use strict";
    const status = document.getElementById("engine-status");
    window.ssalmukLoad().then(() => {
      status.textContent = "AI 엔진 준비 완료";
    }).catch(error => {
      status.textContent = "AI 엔진을 준비하지 못했습니다.";
      console.error("Ssalmuk AI initialization failed:", error);
    });
  </script>
</body>
</html>

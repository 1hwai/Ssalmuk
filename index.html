<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3ed">
  <meta name="description" content="로그인 없이 바로 두는 무료 오목. 혼자 AI와 대결하거나 친구와 한 기기에서 오목을 두세요.">
  <title>오목 한 판 — 바로 두는 오목</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./game.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <a class="brand" href="/" aria-label="오목 한 판 홈"><span class="brand-mark">五</span><span>오목 한 판</span></a>
      <span class="top-note">가입 없이, 바로 한 판</span>
    </header>

    <section id="home" class="screen home-screen">
      <div class="intro">
        <p class="eyebrow">JUST PLAY</p>
        <h1>회원가입 없이,<br><span>바로 두는 오목</span></h1>
        <div class="hero-boards" aria-hidden="true">
          <div class="hero-board hero-board-go">
            <i class="stone black" style="--x:24%;--y:24%"></i><i class="stone white" style="--x:49%;--y:38%"></i><i class="stone black" style="--x:74%;--y:51%"></i><i class="stone white" style="--x:37%;--y:63%"></i><i class="stone black" style="--x:62%;--y:76%"></i>
          </div>
          <div class="hero-board hero-board-gomoku">
            <i class="stone black" style="--x:25%;--y:25%"></i><i class="stone black" style="--x:50%;--y:25%"></i><i class="stone black" style="--x:50%;--y:50%"></i><i class="stone black" style="--x:75%;--y:75%"></i><i class="stone white" style="--x:75%;--y:25%"></i><i class="stone white" style="--x:25%;--y:75%"></i>
          </div>
        </div>
      </div>

      <div class="mode-list">
        <button class="mode-card" data-mode="ai">
          <span class="mode-icon ai-icon" aria-hidden="true">✳</span>
          <span class="mode-text"><strong>1인 모드</strong><small>AI 대전</small></span>
          <span class="mode-arrow" aria-hidden="true">↗</span>
        </button>
        <button class="mode-card" data-mode="local">
          <span class="mode-icon local-icon" aria-hidden="true">◉</span>
          <span class="mode-text"><strong>2인 모드</strong><small>로컬 대전</small></span>
          <span class="mode-arrow" aria-hidden="true">↗</span>
        </button>
      </div>

      <dialog id="color-dialog" class="setup-dialog">
        <form method="dialog" class="setup-form">
          <p class="eyebrow">GAME SETUP</p>
          <h2>대국 설정</h2>
          <p class="setup-description">돌 색상과 AI 난이도를 선택하십시오.</p>
          <label class="color-option">
            <input type="radio" name="player-color" value="1" checked>
            <span class="option-stone black-stone" aria-hidden="true"></span>
            <span><strong>사용자 흑 · AI 백</strong><small>사용자 선공</small></span>
          </label>
          <label class="color-option">
            <input type="radio" name="player-color" value="2">
            <span class="option-stone white-stone" aria-hidden="true"></span>
            <span><strong>AI 흑 · 사용자 백</strong><small>AI 선공</small></span>
          </label>
          <label class="setup-difficulty" for="difficulty-select">AI 난이도
            <select id="difficulty-select">
              <option value="beginner">초급</option>
              <option value="intermediate" selected>중급</option>
              <option value="advanced">고급</option>
              <option value="expert">특급</option>
            </select>
          </label>
          <div class="setup-actions">
            <button id="cancel-setup-button" class="secondary-button" type="button">취소</button>
            <button id="start-ai-button" class="primary-button" type="button">대국 시작</button>
          </div>
        </form>
      </dialog>
      <p class="tiny-note">15 × 15 오목판 · 무료 · 회원가입 없음</p>
    </section>

    <section id="play" class="screen play-screen" hidden>
      <div class="game-heading">
        <button id="back-button" class="text-button" type="button">← 메뉴</button>
        <div class="game-title"><p class="eyebrow">ONE MORE GAME?</p><h1>오목 한 판</h1></div>
        <button id="restart-button" class="icon-button" type="button" aria-label="새 게임" title="새 게임">↻</button>
      </div>

      <div class="status-card" aria-live="polite">
        <span id="turn-stone" class="turn-stone black-stone" aria-hidden="true"></span>
        <div class="status-copy"><strong id="status-title">흑 차례</strong><span id="status-detail">원하는 곳을 눌러 착수하십시오</span></div>
        <span id="move-count" class="move-count">0수</span>
      </div>

      <div class="board-wrap">
        <canvas id="board" class="board" role="grid" aria-label="15 곱하기 15 오목판" tabindex="0"></canvas>
      </div>
      <div class="game-actions">
        <button id="undo-button" class="secondary-button" type="button">한 수 무르기</button>
        <button id="new-button" class="primary-button" type="button">새 게임</button>
      </div>
      <p class="game-hint" id="game-hint">흑돌이 먼저 둡니다.</p>
    </section>

    <footer class="footer"><span>오목 한 판</span><span>가볍게 바로.</span></footer>
  </main>
</body>
</html>
